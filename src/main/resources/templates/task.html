<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>Tasks</h1>
        <div class="user-info">
            <span th:text="${username + ' (' + employeeRole.displayName + ')'}"></span>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" x2="9" y1="12" y2="12"/>
                    </svg>
                    Log out
                </button>
            </form>
        </div>
    </div>

    <!-- Kontrolbar -->
    <div class="control-bar">
        <a th:href="@{/project/subproject/list/{projectId}(projectId=${currentProjectId}, employeeId=${currentEmployeeId})}"
           class="back-button">
            ← Return to subprojects
        </a>

        <a th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).PROJECT_MANAGER}"
           th:href="@{/project/task/createtask/{employeeId}/{projectId}/{subProjectId}(
                    employeeId=${currentEmployeeId},
                    projectId=${currentProjectId},
                    subProjectId=${currentSubProjectId})}"
           class="create-project-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Create new task
        </a>
    </div>

    <!-- Tabel -->
    <table class="task-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Assigned to</th>
            <th>Skills</th>
            <th>Start date</th>
            <th>Deadline</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Note</th>
            <th>Duration</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <!-- Ingen tasks -->
        <tr th:if="${taskList == null or #lists.isEmpty(taskList)}">
            <td colspan="11">You have no tasks yet. Click "Create new task" for an overview.</td>
        </tr>

        <!-- Iteration -->
        <tr th:each="task : ${taskList}">
            <td th:text="${task.taskName}"></td>
            <td th:text="${task.taskDescription}"></td>
            <td>
                <span th:if="${task.assignedEmployee != null}" th:text="${task.assignedEmployee.username}"></span>
                <span th:if="${task.assignedEmployee == null}" class="text-muted">Not assigned</span>
            </td>
            <td>
                <span th:if="${task.assignedEmployee != null and task.assignedEmployee.alphaRoles != null and !#lists.isEmpty(task.assignedEmployee.alphaRoles)}">
                    <span th:each="role, iterStat : ${task.assignedEmployee.alphaRoles}" 
                          th:text="${role.displayName} + (${iterStat.last} ? '' : ', ')"></span>
                </span>
                <span th:if="${task.assignedEmployee == null or task.assignedEmployee.alphaRoles == null or #lists.isEmpty(task.assignedEmployee.alphaRoles)}" 
                      class="text-muted">-</span>
            </td>
            <td th:text="${task.taskStartDate}"></td>
            <td th:text="${task.taskDeadline}"></td>

            <!-- STATUS -->
            <td>
                <!-- TEAM MEMBER: kan ændre -->
                <form th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).TEAM_MEMBER}"
                      th:action="@{/project/task/updatestatus/{taskId}(taskId=${task.taskID})}"
                      method="post">
                    <input type="hidden" name="employeeId" th:value="${currentEmployeeId}">
                    <input type="hidden" name="projectId" th:value="${currentProjectId}">
                    <input type="hidden" name="subProjectId" th:value="${currentSubProjectId}">
                    <select name="taskStatus" onchange="this.form.submit()">
                        <option value="NOT_STARTED"  th:selected="${task.taskStatus.name() == 'NOT_STARTED'}">Not started</option>
                        <option value="IN_PROGRESS"  th:selected="${task.taskStatus.name() == 'IN_PROGRESS'}">In progress</option>
                        <option value="COMPLETED"    th:selected="${task.taskStatus.name() == 'COMPLETED'}">Completed</option>
                    </select>
                </form>

                <!-- PROJECT MANAGER: kan ikke ændre - kun se -->
                <select th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).PROJECT_MANAGER}" disabled>
                    <option value="NOT_STARTED"  th:selected="${task.taskStatus.name() == 'NOT_STARTED'}">Not started</option>
                    <option value="IN_PROGRESS"  th:selected="${task.taskStatus.name() == 'IN_PROGRESS'}">In progress</option>
                    <option value="COMPLETED"    th:selected="${task.taskStatus.name() == 'COMPLETED'}">Completed</option>
                </select>
            </td>

            <!-- PRIORITY -->
            <td>
                <!-- Project Manager KAN ændre -->
                <form th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).PROJECT_MANAGER}"
                      th:action="@{/project/task/updatetaskpriority/{taskId}(taskId=${task.taskID})}"
                      method="post">
                    <input type="hidden" name="employeeId" th:value="${currentEmployeeId}">
                    <input type="hidden" name="projectId" th:value="${currentProjectId}">
                    <input type="hidden" name="subProjectId" th:value="${currentSubProjectId}">
                    <select name="taskPriority" onchange="this.form.submit()">
                        <option value="LOW"      th:selected="${task.taskPriority != null and task.taskPriority.name() == 'LOW'}">Low</option>
                        <option value="MEDIUM"   th:selected="${task.taskPriority != null and task.taskPriority.name() == 'MEDIUM'}">Medium</option>
                        <option value="HIGH"     th:selected="${task.taskPriority != null and task.taskPriority.name() == 'HIGH'}">High</option>
                    </select>
                </form>

                <!-- Team Member kan IKKE ændre - kun se -->
                <select th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).TEAM_MEMBER}" disabled>
                    <option value="LOW"      th:selected="${task.taskPriority != null and task.taskPriority.name() == 'LOW'}">Low</option>
                    <option value="MEDIUM"   th:selected="${task.taskPriority != null and task.taskPriority.name() == 'MEDIUM'}">Medium</option>
                    <option value="HIGH"     th:selected="${task.taskPriority != null and task.taskPriority.name() == 'HIGH'}">High</option>
                </select>
            </td>

            <!-- NOTE -->
            <td>
                <!-- Team member: Vis knap til at redigere note -->
                <a th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).TEAM_MEMBER}"
                   th:href="@{/project/task/note/{employeeId}/{projectId}/{subProjectId}/{taskId}(
                employeeId=${currentEmployeeId},
                projectId=${currentProjectId},
                subProjectId=${currentSubProjectId},
                taskId=${task.taskID})}"
                   class="note-button">Add/edit note</a>

                <!-- Project manager: Vis noten som læsevenlig tekst med auto-update -->
                <div th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).PROJECT_MANAGER}"
                     class="note-wrapper"
                     th:attr="data-task-id=${task.taskID}"
                     data-note-type="task">
                    <span class="note-display">
                        <span th:if="${task.taskNote == null or #strings.isEmpty(task.taskNote)}" class="text-muted">No note</span>
                        <span th:if="${task.taskNote != null and !#strings.isEmpty(task.taskNote)}"
                              th:text="${task.taskNote}"></span>
                    </span>
                </div>
            </td>

            <td>
                <span th:text="${task.taskDuration}"></span> days
            </td>

            <!-- Handlinger -->
            <td>
                <div class="action-buttons">

                    <!-- Rediger -->
                    <a th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).PROJECT_MANAGER}"
                       th:href="@{/project/task/edit/{employeeId}/{projectId}/{subProjectId}/{taskId}(
                                employeeId=${currentEmployeeId},
                                projectId=${currentProjectId},
                                subProjectId=${currentSubProjectId},
                                taskId=${task.taskID})}"
                       class="edit-button">Edit</a>

                    <!-- Slet -->
                    <form th:if="${employeeRole == T(com.example.pkveksamen.model.EmployeeRole).PROJECT_MANAGER}"
                          th:action="@{/task/delete/{employeeId}/{projectId}/{subProjectId}/{taskId}(
                                    employeeId=${currentEmployeeId},
                                    projectId=${currentProjectId},
                                    subProjectId=${currentSubProjectId},
                                    taskId=${task.taskID})}"
                          method="post" style="display:inline">
                        <button type="submit" class="delete-button"
                                onclick="return confirm('Er du sikker på, du vil slette denne task?');">Delete</button>
                    </form>

                    <!-- Se Subtasks -->
                    <a th:href="@{/project/subtask/liste/{projectId}/{subProjectId}/{taskId}/{employeeId}(
                                projectId=${currentProjectId},
                                subProjectId=${currentSubProjectId},
                                taskId=${task.taskID},
                                employeeId=${currentEmployeeId})}"
                       class="subtask-button">View Sub Tasks</a>

                </div>
            </td>

        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
